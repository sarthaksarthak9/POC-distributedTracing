apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: otel-nodejs
spec:
  exporter:
    endpoint: https://10.185.13.105:4319
    tls:
      configMapName: tier2-ca
      ca_file: ca.crt
  propagators: [tracecontext, baggage]
  sampler:
    type: parentbased_always_on
  env:
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: deployment.environment=dev,site=icolo,k8s.cluster.name=k8-dev-icolo-ipsl-apps
  nodejs:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-nodejs:0.78.0
    env:
      - name: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
      - name: OTEL_TRACES_EXPORTER
        value: otlp
      - name: OTEL_METRICS_EXPORTER
        value: none
      - name: OTEL_LOGS_EXPORTER
        value: none
      - name: OTEL_NODE_DISABLED_INSTRUMENTATIONS
        value: fs,dns,net
      # Same CA via Node's trust store, in case this SDK ignores OTEL_EXPORTER_OTLP_CERTIFICATE.
      - name: NODE_EXTRA_CA_CERTS
        value: /otel-auto-instrumentation-configmap-tier2-ca/ca.crt

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tracing-poc

resources:
  - namespace.yaml
  - instrumentation.yaml
  - app.yaml

# Fixed name: operator-case/ mounts the same code.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: tracing-poc-app
    files:
      - app.js
      - entrypoint.sh
